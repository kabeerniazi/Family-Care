<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Testimonial</title>
    <style>
        body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #f4f7f6;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
}

form {
    background: #ffffff;
    padding: 40px;
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    width: 100%;
    max-width: 400px;
}

h1 {
    text-align: center;
    color: #333;
    margin-bottom: 25px;
}

label {
    font-weight: 600;
    color: #555;
    margin-bottom: 5px;
    display: block;
}

input[type="text"],
input[type="number"],
textarea {
    width: 100%;
    padding: 10px;
    margin-bottom: 20px;
    border: 1px solid #ddd;
    border-radius: 5px;
    box-sizing: border-box;
    font-size: 14px;
}

input:focus, textarea:focus {
    border-color: #0b59d6;
    outline: none;
}

button {
    width: 100%;
    background-color: #0b59d6;
    color: white;
    padding: 12px;
    border: none;
    border-radius: 5px;
    font-size: 16px;
    cursor: pointer;
    transition: background 0.3s;
}

button:hover {
    background-color: #0948b3;
}
    </style>


</head>



<body>
    <h1>Add a New Testimonial</h1>
    <form action="/testimonials" method="POST">
        
        <label for="id">Testimonial ID:</label><br>
        <input type="number" id="id" name="id" required><br><br>

        <label for="name">Author Name:</label><br>
        <input type="text" id="name" name="name" placeholder="e.g. John Doe" required><br><br>

        <label for="role">Role:</label><br>
        <input type="text" id="role" name="role" placeholder="e.g. Patient" required><br><br>

        <label for="review">Review:</label><br>
        <textarea id="review" name="review" rows="4" placeholder="Write the review here..." required></textarea><br><br>

        <button type="submit">Add Testimonial</button>
    </form>
    <script src="testimonial.js"></script>
</body>
</body>
</html>
