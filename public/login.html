<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>

<div class="container">

  <div class="left"></div>

  <div class="right">

    <div class="header">
      <a href="homepage.html">Back To Website</a> 
    </div>

    <div class="form-box">
      <h2>Welcome Back!</h2>

      <form id="loginForm">

        <label>Email</label>
        <input type="text" id="email" placeholder="abc@gmail.com">
        <div id="emailError" class="error">Enter a valid email</div>

        <label>Password</label>
        <input type="password" id="password" placeholder="Enter password">
        <div id="passError" class="error">Password must be at least 6 characters</div>

        <div class="links">
          <span>Don't Have An Account? <a href="signup.html">Sign Up</a></span>
          <a href="#">Forget Password</a>
        </div>

        <button type="submit" class="login-btn">Login</button>

        <div class="or">OR</div>

       <div class="social-row">
  <button class="social-btn google">
    <img src="https://cdn-icons-png.flaticon.com/512/2991/2991148.png" class="icon">
    Google
  </button>

  <button class="social-btn facebook">
    <img src="https://cdn-icons-png.flaticon.com/512/733/733547.png" class="icon">
    Facebook
  </button>
</div>
    </div>

  </div>

</div>

<script src="login.js"></script>
</body>
</html>
